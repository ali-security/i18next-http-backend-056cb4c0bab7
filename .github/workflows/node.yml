name: node

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha test file/glob to run instead of the full npm test chain'
        required: false
        default: ''
        type: string

env:
  NPM_CONFIG_REGISTRY: https://:2025-01-23T08%3A07%3A26.124000Z@time-machines-npm.sealsecurity.io/

jobs:
  test:
    name: Test on node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        node: [ '22.x', '20.x', '18.x', '16.x' ]
        # os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: npm test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npm run build && npx mocha $TEST_FILTER -R spec --experimental-modules
          else
            npm test
          fi
      - name: npm pack
        if: matrix.node == '22.x'
        run: npm pack
      - name: Upload package tarball
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: i18next-http-backend-tgz
          path: i18next-http-backend-3.0.2.tgz
          if-no-files-found: error